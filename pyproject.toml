[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timelens"
version = "1.0.0"
description = "TimeLens — measure how much you actually work at your computer (Linux)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "TimeLens contributors" }]
keywords = ["time-tracking", "productivity", "activity-tracker", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Utility",
]
dependencies = []

[project.scripts]
timelens = "timelens.cli:main"

[project.urls]
Homepage = "https://github.com/example/timelens"

[tool.setuptools]
packages = ["timelens"]
